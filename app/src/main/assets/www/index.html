    <script>
    (function () {
      function focusables() {
        document.querySelectorAll('.card, [role="button"], .credits__btn--next').forEach(function (el) {
          if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
        });
      }
      function lazyImages() {
        document.querySelectorAll('img').forEach(function (img) {
          if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
          if (!img.hasAttribute('decoding')) img.setAttribute('decoding', 'async');
        });
      }
      var OCULTAR_TEXTO = ['Cerrar Sesión', 'Cerrar sesion'];
      function ocultarSesion() {
        document.querySelectorAll('button, a, span, div, p').forEach(function (el) {
          if (el.children.length > 0) return;
          var t = el.textContent.trim();
          for (var i = 0; i < OCULTAR_TEXTO.length; i++) {
            if (t === OCULTAR_TEXTO[i]) {
              el.style.display = 'none';
              var par = el.parentElement;
              if (par && (/@/.test(par.textContent || '') || /Usuario:/i.test(par.textContent || ''))) par.style.display = 'none';
            }
          }
        });
        document.querySelectorAll('span, div, p, small').forEach(function (el) {
          if (el.children.length > 0) return;
          var t = el.textContent.trim();
          if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t)) {
            var par = el.parentElement;
            if (par) par.style.display = 'none'; else el.style.display = 'none';
          }
        });
      }
      function aplicar() { focusables(); lazyImages(); ocultarSesion(); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', aplicar);
      else aplicar();
      [300, 800, 1500, 3000, 6000].forEach(function (ms) { setTimeout(aplicar, ms); });
      var pendiente = false;
      new MutationObserver(function () {
        if (pendiente) return;
        pendiente = true;
        setTimeout(function () { pendiente = false; aplicar(); }, 300);
      }).observe(document.body, { childList: true, subtree: true });
    })();
    </script>

    <script>
    (function () {
      var SELECTORES = [
        '.trick__box', '.trick__box--expandable', '.trick__team-link',
        '.card', '.card--leader', '.card--region', '.pokemon-card',
        '.details__tricks > *', '[onclick]'
      ];
      function focusables() {
        SELECTORES.forEach(function (sel) {
          document.querySelectorAll(sel).forEach(function (el) {
            if (el.tagName === 'BUTTON' || el.tagName === 'A') return;
            if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
            if (!el.hasAttribute('role')) el.setAttribute('role', 'button');
          });
        });
      }
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var el = document.activeElement;
        if (!el) return;
        if (el.tagName === 'BUTTON' || el.tagName === 'A' || el.tagName === 'INPUT') return;
        if (el.hasAttribute('tabindex')) { e.preventDefault(); el.click(); }
      });
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', focusables);
      else focusables();
      [300, 800, 1500, 3000, 6000].forEach(function (ms) { setTimeout(focusables, ms); });
      new MutationObserver(focusables).observe(document.body, { childList: true, subtree: true });
    })();
    </script>

    <script>
    (function () {
      function crearBoton() {
        if (document.getElementById('__reload_btn')) return;
        var b = document.createElement('button');
        b.id = '__reload_btn';
        b.textContent = '↻';
        b.title = 'Recargar sin caché';
        b.onclick = function () {
          b.textContent = '…';
          try {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
          } catch (e) {}
          setTimeout(function () { location.reload(); }, 400);
        };
        document.body.appendChild(b);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', crearBoton);
      else crearBoton();
    })();
    </script>

    <script>
    (function () {
      var KEY_VISITADOS = 'farmligas_visitados';
      var KEY_LIDER = 'farmligas_ultimo_lider';
      var ultimoVisto = null;

      function getVisitados() {
        try { return JSON.parse(localStorage.getItem(KEY_VISITADOS) || '[]'); } catch (e) { return []; }
      }
      function setVisitados(a) { try { localStorage.setItem(KEY_VISITADOS, JSON.stringify(a)); } catch (e) {} }

      function liderActivoEl() {
        return document.querySelector('.card--leader.is-active');
      }
      function nombreDe(el) {
        if (!el) return '';
        var ov = el.querySelector('.card__overlay');
        return ov ? (ov.textContent || '').trim() : '';
      }

      function registrarVisitado() {
        var l = liderActivoEl();
        if (!l) { ultimoVisto = null; return; }
        var n = nombreDe(l);
        if (!n) return;
        if (n === ultimoVisto) return;
        ultimoVisto = n;
        var arr = getVisitados();
        if (arr.indexOf(n) === -1) { arr.push(n); setVisitados(arr); }
      }

      function guardarUltimo() {
        var l = liderActivoEl();
        if (l) { try { localStorage.setItem(KEY_LIDER, nombreDe(l)); } catch (e) {} }
      }

      function infoLider() {
        var next = document.querySelector('.credits__btn--next');
        if (!next) return;
        var cont = document.getElementById('__lider_info');
        if (!cont) {
          cont = document.createElement('div');
          cont.id = '__lider_info';
          cont.style.cssText = 'margin:8px 12px;padding:8px 12px;border-radius:10px;border:1px solid rgba(74,222,128,0.3);background:rgba(74,222,128,0.06);color:#d1fae5;font-size:0.9rem;';
          next.parentElement.insertBefore(cont, next.nextSibling);
        }
        var act = liderActivoEl();
        if (!act) { cont.style.display = 'none'; return; }
        var nombre = nombreDe(act);
        var lista = document.querySelectorAll('.card--leader');
        var numero = 0;
        for (var i = 0; i < lista.length; i++) { if (lista[i] === act) { numero = i + 1; break; } }
        cont.style.display = 'block';
        cont.textContent = 'Líder ' + numero + ': ' + nombre;
      }

      function finRun() {
        var next = document.querySelector('.credits__btn--next');
        if (!next) return;
        var regiones = document.querySelectorAll('.card--region');
        var lideres = document.querySelectorAll('.card--leader');
        var regionAct = document.querySelector('.card--region.is-active');
        var liderAct = liderActivoEl();
        if (!regiones.length || !lideres.length || !regionAct || !liderAct) {
          next.style.display = ''; return;
        }
        if (regionAct === regiones[regiones.length - 1] && liderAct === lideres[lideres.length - 1]) {
          next.style.display = 'none';
        } else {
          next.style.display = '';
        }
      }

      setInterval(function () {
        guardarUltimo();
        registrarVisitado();
        infoLider();
        finRun();
      }, 800);
    })();
    </script>

    <script>
    (function () {
      var yaPrefetch = {};
      function prefetchLideres() {
        var regionAct = document.querySelector('.card--region.is-active');
        if (!regionAct) return;
        document.querySelectorAll('.card--leader').forEach(function (l) {
          var img = l.querySelector('.card__leader-image');
          if (!img || !img.src) return;
          if (yaPrefetch[img.src]) return;
          yaPrefetch[img.src] = true;
          var link = document.createElement('link');
          link.rel = 'prefetch';
          link.as = 'image';
          link.href = img.src;
          document.head.appendChild(link);
        });
      }
      setInterval(prefetchLideres, 1500);
    })();
    </script>

    <script>
    (function () {
      var DUR = 200;
      var raf = null;
      Element.prototype.scrollIntoView = function () {
        var el = this;
        var rect = el.getBoundingClientRect();
        var targetY = window.scrollY + rect.top - 80;
        if (raf) cancelAnimationFrame(raf);
        var startY = window.scrollY;
        var dist = targetY - startY;
        if (Math.abs(dist) < 2) return;
        var start = performance.now();
        function step(now) {
          var t = Math.min((now - start) / DUR, 1);
          var ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          window.scrollTo(0, startY + dist * ease);
          if (t < 1) raf = requestAnimationFrame(step);
          else raf = null;
        }
        raf = requestAnimationFrame(step);
      };
    })();
    </script>

    <script>
    (function () {
      var fab = document.getElementById('__fab');
      var panel = document.getElementById('__float_panel');
      var header = document.getElementById('__float_header');
      var closeBtn = document.getElementById('__float_close');
      var body = document.getElementById('__float_body');

      var POS_KEY = 'farmligas_fab_pos';
      var isOpen = false;

      function cargarPos() {
        try {
          var p = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
          if (p && typeof p.x === 'number' && typeof p.y === 'number') {
            fab.style.left = p.x + 'px';
            fab.style.top = p.y + 'px';
            fab.style.right = 'auto';
            fab.style.bottom = 'auto';
          }
        } catch (e) {}
      }
      function guardarPos(x, y) {
        try { localStorage.setItem(POS_KEY, JSON.stringify({ x: x, y: y })); } catch (e) {}
      }

      var drag = { active: false, sx: 0, sy: 0, ox: 0, oy: 0, moved: false };
      fab.addEventListener('pointerdown', function (e) {
        var r = fab.getBoundingClientRect();
        drag.active = true;
        drag.moved = false;
        drag.sx = e.clientX; drag.sy = e.clientY;
        drag.ox = r.left;    drag.oy = r.top;
        fab.setPointerCapture(e.pointerId);
        fab.classList.add('is-dragging');
      });
      fab.addEventListener('pointermove', function (e) {
        if (!drag.active) return;
        var dx = e.clientX - drag.sx;
        var dy = e.clientY - drag.sy;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) drag.moved = true;
        var nx = Math.max(0, Math.min(window.innerWidth - fab.offsetWidth, drag.ox + dx));
        var ny = Math.max(0, Math.min(window.innerHeight - fab.offsetHeight, drag.oy + dy));
        fab.style.left = nx + 'px';
        fab.style.top = ny + 'px';
        fab.style.right = 'auto';
        fab.style.bottom = 'auto';
        if (isOpen) posicionarPanel();
      });
      fab.addEventListener('pointerup', function () {
        if (!drag.active) return;
        drag.active = false;
        fab.classList.remove('is-dragging');
        var r = fab.getBoundingClientRect();
        guardarPos(r.left, r.top);
        if (!drag.moved) togglePanel();
      });
      fab.addEventListener('pointercancel', function () {
        drag.active = false;
        fab.classList.remove('is-dragging');
      });

      function togglePanel() {
        isOpen = !isOpen;
        if (isOpen) {
          renderGuia();
          posicionarPanel();
          panel.classList.add('is-open');
        } else {
          panel.classList.remove('is-open');
        }
      }
      closeBtn.addEventListener('click', function () {
        isOpen = false;
        panel.classList.remove('is-open');
      });

      function posicionarPanel() {
        var fr = fab.getBoundingClientRect();
        var pw = panel.offsetWidth || 320;
        var ph = panel.offsetHeight || 500;
        var px = fr.left + fr.width / 2 - pw / 2;
        var py = fr.top - ph - 10;
        if (py < 8) py = fr.bottom + 10;
        px = Math.max(8, Math.min(window.innerWidth - pw - 8, px));
        py = Math.max(8, Math.min(window.innerHeight - ph - 8, py));
        panel.style.left = px + 'px';
        panel.style.top = py + 'px';
      }

      var pdrag = { active: false, sx: 0, sy: 0, ox: 0, oy: 0 };
      header.addEventListener('pointerdown', function (e) {
        if (e.target === closeBtn) return;
        var r = panel.getBoundingClientRect();
        pdrag.active = true;
        pdrag.sx = e.clientX; pdrag.sy = e.clientY;
        pdrag.ox = r.left;     pdrag.oy = r.top;
        header.setPointerCapture(e.pointerId);
      });
      header.addEventListener('pointermove', function (e) {
        if (!pdrag.active) return;
        var nx = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, pdrag.ox + (e.clientX - pdrag.sx)));
        var ny = Math.max(0, Math.min(window.innerHeight - panel.offsetHeight, pdrag.oy + (e.clientY - pdrag.sy)));
        panel.style.left = nx + 'px';
        panel.style.top = ny + 'px';
      });
      header.addEventListener('pointerup', function () { pdrag.active = false; });
      header.addEventListener('pointercancel', function () { pdrag.active = false; });

      function renderGuia() {
        var lider = document.querySelector('.card--leader.is-active');
        if (!lider) {
          body.innerHTML = '<div class="empty">Selecciona un líder en la página principal para ver su guía aquí.</div>';
          return;
        }
        var nombre = (lider.querySelector('.card__overlay') || {}).textContent || 'Líder';
        nombre = nombre.trim();

        var html = '<h3>Líder: ' + escapeHtml(nombre) + '</h3>';

        var region = document.querySelector('.card--region.is-active .card__overlay');
        if (region) html += '<p><strong>Región:</strong> ' + escapeHtml(region.textContent.trim()) + '</p>';

        var pokes = document.querySelectorAll('.pokemon-card');
        if (pokes.length) {
          html += '<h4>Pokémon (' + pokes.length + ')</h4><ul>';
          pokes.forEach(function (p) {
            var n = (p.querySelector('.pokemon-card__name') || {}).textContent || '';
            n = n.trim();
            if (!n) return;
            var lv = (p.querySelector('.pokemon-card__level, .pokemon-card__lv, .lv') || {}).textContent || '';
            lv = lv.trim();
            html += '<li><span class="mon">' + escapeHtml(n) + '</span>';
            if (lv) html += ' <span class="lv">' + escapeHtml(lv) + '</span>';
            html += '</li>';
          });
          html += '</ul>';
        }

        var detalles = document.querySelector('.details');
        if (detalles) {
          var txt = detalles.innerText.trim();
          if (txt) html += '<h4>Detalles</h4><p>' + escapeHtml(txt.slice(0, 1200)) + '</p>';
        }

        body.innerHTML = html;
        body.scrollTop = 0;
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      var lastSig = '';
      setInterval(function () {
        if (!isOpen) return;
        var l = document.querySelector('.card--leader.is-active');
        var sig = l ? (l.querySelector('.card__overlay') || {}).textContent || '' : '';
        var nPokes = document.querySelectorAll('.pokemon-card').length;
        var fullSig = sig + '|' + nPokes;
        if (fullSig !== lastSig) { lastSig = fullSig; renderGuia(); }
      }, 600);

      window.addEventListener('resize', function () { if (isOpen) posicionarPanel(); });

      cargarPos();
    })();
    </script>

  </body>
</html>
